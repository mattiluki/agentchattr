[server]
port = 8300
host = "127.0.0.1"
data_dir = "./data"

# Add agents here. Each gets a status pill, @mention routing, and color.
# "cwd" is the working directory for the agent's terminal session.
# "command" is the CLI command (must be on PATH).

[agents.claude]
command = "/Users/zeroclaw/.local/bin/claude-with-model.sh"
cwd = ".."
color = "#da7756"
label = "Claude"
# AgentOS per-agent model selector: reads ~/agentos/.env.claude
# Override per-launch with CLAUDE_MODEL=...

[agents.codex]
command = "/Users/zeroclaw/.local/bin/codex-with-model.sh"
cwd = ".."
color = "#10a37f"
label = "Codex"
# AgentOS per-agent model selector: reads ~/agentos/.env.codex
# Override per-launch with CODEX_MODEL=...

[agents.gemini]
command = "/Users/zeroclaw/.local/bin/gemini-fallback.sh"
cwd = ".."
color = "#4285f4"
label = "Gemini"
# AgentOS fallback wrapper: defaults to gemini-2.5-flash (high quota).
# Override per-launch with: GEMINI_MODEL=gemini-2.5-pro

[agents.kimi]
type = "api"
base_url = "https://api.moonshot.cn/v1"
model = "moonshot-v1-8k"
cwd = ".."
color = "#1783ff"
label = "Kimi"
api_key_env = "MOONSHOT_API_KEY"
temperature = 0.6

[agents.qwen]
command = "qwen"
cwd = ".."
color = "#8b5cf6"
label = "Qwen"
mcp_inject = "settings_file"
mcp_settings_path = ".qwen/settings.json"
mcp_transport = "http"

